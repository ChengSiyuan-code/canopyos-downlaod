<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CanopyOS 下载中心</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <div class="logo">CanopyOS</div>
    <div class="ver">Professional Edition v3.0.267</div>
    <h1 data-i18n="title">下载中心</h1>
    <p class="desc" data-i18n="desc">选择你要下载的文件，下载后自动计数</p>

    <div class="downloads">
      <a href="https://storage.to/W7xwyMFQ0" class="dl-btn" id="dl-img" onclick="trackDownload('img')">
        <span class="ico">💿</span>
        <span class="info">
          <span class="name" data-i18n="img.name">系统镜像</span>
          <span class="size">CanopyOS.img · 4 MB</span>
        </span>
      </a>
      <a href="https://github.com/ChengSiyuan-code/CanopyOS-master-3/releases/tag/3.0.267" class="dl-btn" id="dl-src" onclick="trackDownload('src')">
        <span class="ico">📦</span>
        <span class="info">
          <span class="name" data-i18n="src.name">源码包</span>
          <span class="size">canopyos-master.zip · 350MB</span>
        </span>
      </a>
    </div>

    <div class="counter">
      <span data-i18n="c.pre">你是 CanopyOS 镜像第 </span><strong id="count-num">--</strong><span data-i18n="c.post"> 个下载者</span>
    </div>

    <div class="back">
      <a href="../" data-i18n="back">← 返回主页</a>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
